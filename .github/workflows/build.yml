name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Harsh-Video-Player.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: HarshVideoPlayer
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp HarshVideoPlayer/app/build/outputs/apk/debug/app-debug.apk Harsh-Video-Player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Harsh-Video-Player-apk
          path: Harsh-Video-Player.apk

      - name: Publish release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Harsh-Video-Player.apk
